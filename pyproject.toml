[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "roadmap-mcp"
version = "0.1.0"
description = "File-backed career skill roadmaps exposed through MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "pydantic>=2.12,<3"]

[project.scripts]
roadmap-mcp = "roadmap_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/roadmap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
